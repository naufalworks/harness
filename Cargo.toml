[package]
name = "harness"
version = "0.2.0"
edition = "2021"
# This crate is a deployed binary, never a registry package. Saying so lets
# cargo-deny's private-crate rule skip the missing `license` field instead of
# failing the license gate on our own code.
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
tungstenite = "0.30"
dotenvy = "0.15"
# P18: TLS comes from rustls, not the platform's OpenSSL. reqwest's default
# features pull in native-tls -> openssl-sys, whose build script needs a target
# OpenSSL discoverable through pkg-config. pkg-config cannot cross-compile, so
# that dependency made `cargo check --target aarch64-unknown-linux-gnu` fail in
# the release-evidence CI job while the host build stayed green. rustls is pure
# Rust over `ring`, which this crate already depends on for SHA-256, so this
# removes a C toolchain from the cross build instead of adding a sysroot to
# work around it. No code used a native-tls-specific API. `charset` and `http2`
# are restored explicitly because disabling default features would otherwise
# drop them.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
anyhow = "1.0"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
# P2-T01: the SSE body is a stream; this is the `Stream` trait axum already depends on, so the
# activity feed needs no new runtime, only the trait to hand a channel to `Body::from_stream`.
futures-core = "0.3"

ring = "0.17"

# P6-T01: `ast_edit` matches and rewrites Rust by syntax, not by text. `ast-grep-core` is the
# matcher/rewriter and `ast-grep-language` carries the tree-sitter grammars. Its default
# `builtin-parser` feature would compile 27 grammars for a tool that accepts one language, so
# defaults are off and only Rust is enabled; adding a language is one feature flag. The `sg`
# binary is deliberately not used: it is not installed here and would make the tool host-dependent.
ast-grep-core = "0.45"
ast-grep-language = { version = "0.45", default-features = false, features = ["tree-sitter-rust"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# P2-T01: `start_paused` asserts the 15 s stream heartbeat in virtual time instead of waiting
# 15 real seconds. Test-only on purpose: dev-dependency features are not unified into the
# `cargo build` binary, so the shipped server keeps tokio's normal clock.
tokio = { version = "1", features = ["test-util"] }
