name: harness-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

# Every action is pinned to an immutable commit SHA. A tag like @v4 is a moving
# target: whoever controls the action repository can repoint it at new code that
# then runs with this workflow's token. The trailing comment records which tag
# the SHA corresponded to when it was pinned; scripts/check_supply_chain.py
# fails the build if any ref here is not a 40-character SHA.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      # Formatting and the warning budget come first: they are fast and they
      # fail for reasons that never require reading a test log.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked

      # Shell lint. The release host has no shellcheck, so this step is the only
      # place it actually runs; `bash -n` in the local gate is a syntax check,
      # not a substitute for it.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh

      # Python lint. The suites below execute the scripts; ruff is the only
      # step that checks the ones CI never imports.
      - run: pipx install ruff==0.16.7
      - run: ruff check tests scripts

      # Python suites run with ResourceWarning promoted to an error so a leaked
      # socket or file handle fails here instead of becoming flake later.
      - run: python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 -W error::ResourceWarning tests/integration_smoke.py
      - run: python3 -W error::ResourceWarning tests/recording_integration.py

      # Claim gates: documentation/route/deployment drift and supply-chain shape.
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/check_supply_chain.py

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # These two need network access to advisory and license data, so they can
      # only run here, never on the offline release host. Failing this job is the
      # only signal that a dependency carries a known advisory or a disallowed
      # licence; the local gate asserts only that these steps still exist.
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit --deny warnings
      - run: cargo deny check licenses bans sources

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: node --check static/app.js
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: scripts/verify_e2e.sh

  release-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo install --locked cargo-llvm-cov --version 0.6.13
      - run: cargo llvm-cov --locked --all-features --workspace --fail-under-lines 50
      - run: cargo check --locked --target x86_64-unknown-linux-gnu
      - run: cargo check --locked --target aarch64-unknown-linux-gnu
      - run: python3 tests/fuzz_import_protocol.py
      - run: python3 scripts/benchmark.py --check --sessions 10000 --events 100000
      - run: python3 tests/deploy_rollback.py
      - name: Build reproducible release twice
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) CARGO_TARGET_DIR=target-a cargo build --locked --release
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) CARGO_TARGET_DIR=target-b cargo build --locked --release
          cmp target-a/release/harness target-b/release/harness
          install -D -m 0755 target-a/release/harness target/release/harness
          HARNESS_RELEASE_SKIP_BUILD=1 scripts/release.sh
          sha256sum -c dist/*.tar.gz.sha256
          tar -tzf dist/*.tar.gz | grep '/sbom.cdx.json$'
      - name: Sign checksum with keyless Sigstore identity
        if: github.event_name != 'pull_request'
        run: |
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          "$(go env GOPATH)/bin/cosign" sign-blob --yes --bundle dist/release.sigstore.json dist/*.tar.gz.sha256

  public-smoke:
    if: github.event_name == 'workflow_dispatch' && vars.HARNESS_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/public_smoke.py --url "$HARNESS_PUBLIC_URL"
        env:
          HARNESS_PUBLIC_URL: ${{ vars.HARNESS_PUBLIC_URL }}
          HARNESS_PUBLIC_SMOKE_TOKEN: ${{ secrets.HARNESS_PUBLIC_SMOKE_TOKEN }}
