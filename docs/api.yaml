# OpenAPI contract for the Harness HTTP surface.
#
# This file is checked, not decorative. `tests/test_api_schema.py` compares every
# method+path pair here against `router()` in `src/api/routes.rs` in both
# directions, and compares the error-code enum below against the code table in
# `src/api/error.rs`. A route cannot be added, renamed or removed, and an error
# code cannot be introduced, without this file changing in the same commit.
#
# Scope note, so this contract does not over-claim: the chat receipt is now
# fully specified, and checked field for field against the builder in
# `src/recording.rs` together with the `RequestState` enum the handlers branch
# on. The remaining success payloads are still deliberately unconstrained:
# their handlers assemble `Json<serde_json::Value>` inline, so field-level
# schemas would document an intention rather than the running code. Error
# bodies are fully specified, because one shared envelope produces them all.
openapi: 3.1.0
info:
  title: Harness API
  version: 0.2.0
  description: |
    The HTTP surface of the Harness process.

    Authentication is checked before existence: an unauthenticated request to an
    authenticated route never learns whether the path exists. Every JSON failure
    shares one envelope (`ApiError`) carrying a human sentence, a stable machine
    code, and whether a retry may help.
servers:
  - url: http://127.0.0.1:8080
    description: Default local bind address.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Master token from `HARNESS_AUTH_TOKEN`, or a short-lived session token
        issued by `POST /auth/session`.
  schemas:
    ApiError:
      type: object
      description: |
        The single failure envelope for every JSON route. `error` is a complete
        human sentence intended to be shown verbatim; it is the field the browser
        UI reads. `code` is the stable token clients branch on. `retryable` says
        whether repeating the identical request may succeed.
      required: [error, code, retryable]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable sentence, safe to display verbatim.
        code:
          type: string
          description: |
            Stable machine-readable code. Derived from the HTTP status by
            `error_code` in `src/api/error.rs`; this enum must match that table
            exactly.
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - gone
            - payload_too_large
            - unsupported_media_type
            - unprocessable_body
            - rate_limited
            - internal_error
            - not_implemented
            - upstream_failed
            - unavailable
            - upstream_timeout
            - error
        retryable:
          type: boolean
          description: |
            True only for congestion and upstream faults (429, 502, 503, 504).
            A 500 is deliberately false: the server cannot promise the failed
            operation had no effect. Clients that retry anyway must rely on the
            request identifier for idempotency.
    RequestState:
      type: string
      description: |
        The durable state of a request, mirroring `recording::RequestState`.
        `captured` and `generating` are the pending states; the other three are
        terminal. Only `failed` and `interrupted` can be retried, because a
        `complete` request already has a paid-for answer.
      enum:
        - captured
        - generating
        - complete
        - failed
        - interrupted
    Receipt:
      type: object
      description: |
        The durable record of one request, returned by every chat operation.
        Every field is always present; absence is expressed as null rather than
        omission, so a client can read a field without probing for it.
      required:
        - request_id
        - session_id
        - scope
        - model
        - redacted
        - state
        - error_code
        - captured_at
        - updated_at
        - response
        - memory_job_id
        - memory_status
        - recording
        - context_available
        - recalled
        - recalled_context_applied
        - confirmation_prompt
        - cancel_requested_at
        - cancelled_at
        - safe_boundary_seq
        - retry_of
        - retried_by
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
          description: Identifier to poll, cancel, or retry this request.
        session_id:
          type: string
        scope:
          type: string
        model:
          type: string
        redacted:
          type: boolean
        state:
          $ref: '#/components/schemas/RequestState'
        error_code:
          type: [string, 'null']
          description: |
            Why a terminal request ended that way. `cancelled` distinguishes a
            deliberate cancellation from any other interruption.
        captured_at:
          type: string
        updated_at:
          type: string
        response:
          type: [string, 'null']
          description: The answer text, once one exists.
        memory_job_id:
          type: [string, 'null']
        memory_status:
          type: string
          description: |
            The memory job's status when there is one, otherwise
            `waiting_for_turn` while the request is pending and `deferred` once
            it is not.
        recording:
          type: string
          description: Always `sanitized_local`; recording never leaves the host.
        context_available:
          type: boolean
        recalled:
          type: array
          description: Memories recalled into this turn's context; empty when none.
          items: {}
        recalled_context_applied:
          type: boolean
        confirmation_prompt:
          type: [string, 'null']
          description: Always null in this build; reserved for confirmation flows.
        cancel_requested_at:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
        safe_boundary_seq:
          type: [integer, 'null']
          description: |
            The last step known not to have crossed a mutating boundary. A retry
            is refused when the run crossed, or may have crossed, past it.
        retry_of:
          type: [string, 'null']
        retried_by:
          type: [string, 'null']
  responses:
    Error:
      description: Request failed; body is the shared error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: Request identifier (UUID).
      schema:
        type: string
        format: uuid
    SessionId:
      name: id
      in: path
      required: true
      description: Session identifier (UUID).
      schema:
        type: string
        format: uuid
    OpaqueId:
      name: id
      in: path
      required: true
      description: Identifier of the addressed record.
      schema:
        type: string
    ScopeName:
      name: scope
      in: path
      required: true
      description: Scope name.
      schema:
        type: string
    ScopeQuery:
      name: scope
      in: query
      required: false
      description: Scope name; defaults to the global scope when omitted.
      schema:
        type: string
security:
  - bearerAuth: []
paths:
  /:
    get:
      operationId: index
      summary: Serve the single-page application shell.
      security: []
      responses:
        '200':
          description: HTML document.
          content:
            text/html: {}
        '304':
          description: Cached copy is still valid.
  /api.js:
    get:
      operationId: apiClientScript
      summary: Serve the HTTP client script.
      description: >-
        Loaded before the application script, which depends on it. Mirrors the error envelope and
        the request states; tests/test_api_schema.py checks that mirror against the server.
      security: []
      responses:
        '200':
          description: JavaScript, content-encoding negotiated.
          content:
            text/javascript: {}
        '304':
          description: Cached copy is still valid.
  /app.js:
    get:
      operationId: appScript
      summary: Serve the application script.
      security: []
      responses:
        '200':
          description: JavaScript, content-encoding negotiated.
          content:
            text/javascript: {}
        '304':
          description: Cached copy is still valid.
  /style.css:
    get:
      operationId: appStyles
      summary: Serve the application stylesheet.
      security: []
      responses:
        '200':
          description: CSS, content-encoding negotiated.
          content:
            text/css: {}
        '304':
          description: Cached copy is still valid.
  /auth/session:
    post:
      operationId: createBrowserSession
      summary: Exchange the master token for a short-lived session token.
      description: |
        Requires the master bearer token specifically; a session token cannot
        mint another session.
      responses:
        '201':
          description: Session token and its lifetime in seconds.
          content:
            application/json:
              schema:
                type: object
                required: [session_token, expires_in]
                additionalProperties: false
                properties:
                  session_token:
                    type: string
                  expires_in:
                    type: integer
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat:
    post:
      operationId: chat
      summary: Submit a prompt, briefly waiting for fast providers.
      description: |
        Compatibility endpoint. Waits a bounded time for a complete answer and
        otherwise returns the durable receipt. Disconnecting never cancels the
        generation worker.
      responses:
        '200':
          description: Generation completed within the wait window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '202':
          description: Durable receipt; poll it for the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '502':
          description: Generation failed or was interrupted; receipt included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/submit:
    post:
      operationId: submitChat
      summary: Submit a prompt and return its durable receipt immediately.
      responses:
        '200':
          description: Existing terminal receipt for an identical request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '202':
          description: Accepted; receipt is captured or generating.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}:
    get:
      operationId: getReceipt
      summary: Read the durable receipt for a request.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/cancel:
    post:
      operationId: cancelRequest
      summary: Request cancellation of an in-flight generation.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: |
            Cancellation recorded for a generating request; the turn is being
            interrupted. Poll the receipt for the terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '200':
          description: |
            Already interrupted by an earlier cancellation, so a repeated
            cancel is reported as done rather than as a conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/retry:
    post:
      operationId: retryRequest
      summary: Retry a failed or interrupted request.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: |
            Retry admitted; the new attempt is pending, so poll the receipt.
            This is the only success status: a retry never completes inline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/context:
    get:
      operationId: getContext
      summary: Read the context assembled for a request.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Context record.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/steps:
    get:
      operationId: requestSteps
      summary: List the recorded steps of a turn.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Steps in sequence order.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/incident:
    get:
      operationId: requestIncident
      summary: Read the incident graph for a request.
      description: >-
        Bounded, closed causal projection over recorded rows. P16-T01 adds reviewer
        navigation on the same projection rather than a second one: filter by relation,
        node kind, recorded status, mutation path, tool name or durable row id; free-text
        search over node labels; a chronological view beside the causal one; and bounded
        expansion by passing an `expansion_cursors` object back unchanged as `anchor`.
        Every node carries a confidence label — `recorded_dependency` when a provenance
        edge exists, `temporal_proximity` when the row merely co-occurred with a recorded
        time, `unknown` when neither. Proximity is never presented as causation, and no
        field carries model reasoning.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: view
          in: query
          required: false
          schema: {type: string, enum: [causal, chronological]}
        - name: relation
          in: query
          required: false
          schema: {type: string, enum: [supports, contradicts, depends_on, authorizes, mutates, invalidates, triggers]}
        - name: kind
          in: query
          required: false
          schema: {type: string, maxLength: 200}
        - name: status
          in: query
          required: false
          schema: {type: string, maxLength: 200}
        - name: path
          in: query
          required: false
          schema: {type: string, maxLength: 200}
        - name: tool
          in: query
          required: false
          schema: {type: string, maxLength: 200}
        - name: row_id
          in: query
          required: false
          schema: {type: string, maxLength: 200}
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 200}
        - name: anchor
          in: query
          required: false
          description: >-
            An `expansion_cursors` object from a previous response, serialized verbatim. Opaque:
            an anchor from another projection is refused rather than reinterpreted.
          schema: {type: string, maxLength: 2000}
      responses:
        '200':
          description: >-
            Incident graph, including the earliest known break, the confidence legend, the
            chronological timeline and per-collection truncation counts.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/provenance:
    get:
      operationId: requestProvenance
      summary: Read the provenance edges recorded for a request.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Provenance edges.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/incident/export:
    get:
      operationId: incidentExport
      summary: Export one request's causal graph as a sanitized artifact.
      description: >-
        P16-T02. The artifact is rendered from the same bounded `incident_view` projection
        `/chat/requests/{id}/incident` returns, and it is sanitized, cited and checksummed by
        the shared P15-T04 export machinery rather than a second exporter. Nodes and edges
        carry an explicit evidence label: `dependency` for a recorded consuming or supporting
        edge, `contradiction` for a recorded `contradicts`/`invalidates` edge, `temporal` for
        same-request co-occurrence with no edge, and `unknown` when neither is available. A
        label the shared sanitizer refuses is replaced with a `[withheld: <code>]` marker and
        counted, never shipped and never silently dropped. `format=graphviz` adds a DOT
        rendering of that same sanitized artifact, so the DOT cannot contain a byte the JSON
        withheld.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: format
          in: query
          required: false
          schema: {type: string, enum: [json, graphviz]}
      responses:
        '200':
          description: >-
            Sanitized bounded causal graph with per-node and per-edge evidence labels, the
            shared citation shape, and a checksum over the canonical serialization.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/incidents/compare:
    get:
      operationId: incidentCompare
      summary: Compare two or more runs' causal graphs.
      description: >-
        P16-T02. Each run is read through the same `incident_view` projection the incident
        endpoint serves, then aligned by semantic step identity — what a node is (kind, tool,
        action and path) plus its ordinal among identical siblings — deliberately excluding
        row ids, timestamps and sequence numbers, which differ between runs for reasons that
        are not differences. Each aligned slot is `identical`, `differs`, or
        `missing_evidence`; the last is reported separately and names the runs the step is
        missing from, because an absence of recorded evidence is not a recorded difference and
        is not proof the step did not occur. `first_divergence` reports the earliest
        non-identical slot in the leading run's own order. No counterfactual outcome is
        claimed for any run, and no field carries model reasoning.
      parameters:
        - name: requests
          in: query
          required: true
          description: Two to eight comma-separated request identifiers.
          schema: {type: string, maxLength: 400}
      responses:
        '200':
          description: >-
            Aligned slots with per-run observations, the first divergence, verdict counts,
            and the evidence and alignment legends.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/coverage:
    get:
      operationId: incidentCoverage
      summary: Measure causal coverage for one request.
      description: >-
        P16-T03. Missing-edge, earliest-break, graph-size and reviewer-time metrics, all
        measured through the same bounded `incident_view` projection the incident endpoint
        serves, so a coverage figure can never describe a graph the reviewer cannot open. Only
        a recorded provenance edge counts toward coverage: a `temporal_proximity` row is an
        evidence gap, never folded in as covered. A node with no recorded edge is reported as
        unmeasured evidence, not as a row proven to have no cause, and an unrecorded
        earliest-break is reported as `unknown` rather than as a run that succeeded. Reviewer
        time is measured from closed review sessions only; open and abandoned reviews are
        counted separately and never assigned an assumed duration.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: >-
            Coverage report with graph size, edge coverage, the evidence breakdown, the
            earliest recorded break, measured reviewer time and the metric legend.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/incidents/coverage:
    get:
      operationId: incidentCoverageSummary
      summary: Aggregate causal coverage across requests.
      description: >-
        P16-T03. Per-request figures are retained beside the aggregate so the output is citable
        as audit evidence: a reader can trace a rolled-up number back to the individual
        recorded run it came from. A request with no recording is reported as not measured
        rather than folded in as zero coverage, because averaging in an absence would
        understate coverage of what was actually recorded.
      parameters:
        - name: requests
          in: query
          required: true
          description: One to fifty comma-separated request identifiers.
          schema: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Per-request coverage reports plus the aggregate over measured requests.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/review:
    post:
      operationId: incidentReview
      summary: Open or close a measured reviewer session over one incident.
      description: >-
        P16-T03. Reviewer time is measured, not estimated: a session is opened when a reviewer
        starts and closed with a real duration and a recorded outcome. The graph size served to
        the reviewer is recorded with the session, because a duration is only interpretable
        next to how much graph the reviewer was shown. `unknown` is an accepted outcome so a
        reviewer who identified no cause can say so instead of picking one, and `abandoned` is
        a real reportable outcome rather than a missing row.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: The opened review identifier, or confirmation that a review was closed.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /deployments:
    get:
      operationId: deploymentProvenance
      summary: Read recorded deployment, build, restart and smoke provenance.
      description: >-
        P16-T03. A deployment is a first-class recorded event: nothing in the database can
        reconstruct after the fact which commit was promoted at which second by which binary
        hash, so `scripts/deploy.sh` records each phase as it happens. `parent_id` is the phase
        a phase actually followed — a recorded dependency, never inferred from adjacent
        timestamps. An anomaly flag of `null` means the question was never asked, which is
        deliberately distinct from `false`, meaning it was asked and the answer was no.
      parameters:
        - name: deployment_id
          in: query
          required: false
          description: Omit to read the most recent recorded phases across deployments.
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: >-
            Recorded deployment phases with their parent links, build identity, anomaly flags
            and the count of phases whose result is still unresolved or unknown.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
    post:
      operationId: recordDeployment
      summary: Record or complete one phase of a deployment.
      description: >-
        P16-T03. Called by `scripts/deploy.sh`. A new phase needs a `deployment_id` and a
        `phase`; completing a phase recorded as `started` needs its `event_id` and the result.
        Migration 015 makes recorded provenance append-only: only the fields genuinely unknown
        at insert time (the phase's result and its anomaly flags) may be filled in later, and
        no recorded phase can be deleted or rewritten.
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: The recorded phase identifier, or confirmation that a phase was finished.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /chat/requests/{id}/retrieval:
    get:
      operationId: requestRetrieval
      summary: Read the retrieval explanation recorded for a request.
      description: >-
        Write-once receipt of which memories retrieval considered, which were sent, and why each
        was included or excluded. Records retrieval behaviour only; it makes no claim about how
        the model used the sent memories. 404 when the turn recorded no retrieval receipt.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Retrieval receipt with per-candidate scores, decisions and reasons.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /memory/retrieval/preview:
    post:
      operationId: previewRetrieval
      summary: Rehearse retrieval for a prompt, optionally with a pending candidate approved.
      description: >-
        Runs the shipped ranking inside a transaction that is always rolled back, so nothing is
        approved, no embedding is written and no recall counter moves. Reports the before/after
        ranking and the added/removed delta.
      responses:
        '200':
          description: Rehearsed ranking delta and its no-causal-claim note.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /memory/governance:
    get:
      operationId: memoryGovernance
      summary: Read branch, pin, expiry and duplicate state for one scope.
      description: >-
        Reports the reviewed entries of a scope with their branch, pinned flag, expiry clock,
        conflict group and usefulness counts, plus the scope's branches and its duplicate
        suggestions. Lapsed temporary memories are swept to 'expired' first, so the state shown
        is the state recall acts on. Duplicates are suggestions for review, never auto-merges.
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
      responses:
        '200':
          description: Governance overview for the scope.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /memory/entries/{id}/timeline:
    get:
      operationId: memoryTimeline
      summary: Read the review history of one memory.
      description: >-
        Value revisions, decisions (chosen, considered, superseded with the reason each carries)
        and usefulness verdicts for one memory. Superseded, rejected and expired values are kept
        here rather than deleted. 404 when the memory is not in the scope.
      parameters:
        - $ref: '#/components/parameters/OpaqueId'
        - $ref: '#/components/parameters/ScopeQuery'
      responses:
        '200':
          description: Revisions, decisions and feedback for the memory.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /memory/entries/{id}/governance:
    post:
      operationId: governMemory
      summary: Pin, expire, merge or rate one memory.
      description: >-
        One audited act per call: `pin`, `unpin`, `expire` (with `expires_at`), `clear_expiry`,
        `merge` (with `target_id`, which is retained as superseded), `useful` or `not_useful`.
        Every accepted act writes a revision row. 409 when the memory cannot take the act, which
        includes a usefulness verdict already recorded for that revision.
      parameters:
        - $ref: '#/components/parameters/OpaqueId'
      responses:
        '200':
          description: The recorded outcome of the act.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /memory/branches:
    post:
      operationId: checkoutMemoryBranch
      summary: Create or check out a review branch for a scope.
      description: >-
        A branch holds an alternative reviewed value for a key. While it is checked out, recall
        prefers the branch value and the value on 'main' is left untouched.
      responses:
        '200':
          description: The scope's branch and which branch is now active.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /history/search:
    get:
      operationId: searchHistory
      summary: Search sanitized conversation turns and artifacts within a scope.
      description: >-
        Scoped full-text search over the sanitized history projection. Every hit carries a
        citation naming the source row, its revision, its kind and its timestamp, so a result can
        be traced back to what it quotes. Forgotten and source-deleted documents are never
        returned, and a stored body that no longer passes the shared sanitizer is suppressed
        rather than served. Only sanitized content is ever indexed.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
        - name: session_id
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [turn, artifact]
      responses:
        '200':
          description: Bounded hits with citations, plus how many rows the read-time gate suppressed.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /history/index:
    post:
      operationId: indexHistory
      summary: Refresh the sanitized history search projection.
      description: >-
        Projects completed turns and stored artifacts into the search index after the shared
        sanitizer accepts them. Refused rows are reported with a reason and never indexed.
        Unchanged content is left untouched, and a source-deleted document is never resurrected.
      requestBody:
        required: false
        content:
          application/json: {}
      responses:
        '200':
          description: Counts of indexed, revision-advanced and unchanged documents, plus refusals.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /history/documents/{id}:
    get:
      operationId: historyDocument
      summary: The citation and audit trail of one indexed history document.
      description: >-
        How the forget / source-delete difference is read back. After a forget this still shows
        the entry, its citation and that its content is retained. After a source delete it shows
        the audited deletion with the content gone.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Citation, suppression and deletion state, and the append-only event list.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /history/documents/{id}/privacy:
    post:
      operationId: historyDocumentPrivacy
      summary: Forget, restore, or source-delete one indexed history document.
      description: >-
        Two distinct operations with different semantics, neither implying the other. `forget`
        stops the entry being recalled or returned while its content and revision trail are
        retained, and `restore` lifts that suppression. `delete_source` removes the underlying
        content and keeps only the audited fact that the entry existed and was deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: The request was already satisfied; nothing was written twice.
          content:
            application/json: {}
        '202':
          description: The operation was recorded together with its audit event.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /export/bundles:
    post:
      operationId: createExportBundle
      summary: Assemble a draft export bundle of selected memories and history documents.
      description: >-
        Nothing leaves here. The response is what would leave, so an operator can review it
        first. Items the shared sanitizer refuses, and documents that were forgotten or
        source-deleted, are recorded as refused rather than carried.
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: The draft bundle, its items, and how many were refused.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /export/bundles/{id}/review:
    post:
      operationId: reviewExportBundle
      summary: Review, or approve, exactly what a bundle would export.
      description: >-
        The audience-review step. Without `approve` this previews the exact contents and returns
        the digest to approve them against; with `approve` and that digest it records the review.
        A stale digest is a conflict rather than a silent re-approval, so contents that changed
        after review cannot be blessed by an older look.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: The preview, or the recorded review with its pinned digest.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /export/bundles/{id}/release:
    post:
      operationId: releaseExportBundle
      summary: Serialize a reviewed bundle into a sealed continuation packet.
      description: >-
        Refuses an unreviewed bundle, an unsanitized or unreviewed item, and contents whose
        digest no longer matches the reviewed one. The packet carries stable ids, revisions,
        per-item and bundle checksums, and reproduces no past answer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: The sealed continuation packet.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
  /export/import:
    post:
      operationId: importContinuationPacket
      summary: Import a continuation packet.
      description: >-
        Verified against the local sanitizer and its checksums first, then merged by stable id
        plus revision. Re-importing the same packet is recorded as unchanged rather than
        duplicated, a lower revision never overwrites newer local content, and a ported memory
        is recorded for local approval rather than activated.
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: The import receipt and a per-item decision list.
          content:
            application/json: {}
        '4XX':
          $ref: '#/components/responses/Error'
        '5XX':
          $ref: '#/components/responses/Error'
